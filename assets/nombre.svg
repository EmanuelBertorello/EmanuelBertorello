<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Emanuel Bertorello, desarrollador full stack. Español nativo, inglés avanzado.">
  <title>Emanuel Bertorello</title>
  <defs>
    <filter id="em-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.08  0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0.42 0"/>
    </filter>
  </defs>

  <rect width="1200" height="250" fill="#f4efe4"/>
  <rect width="1200" height="250" filter="url(#em-grain)" opacity="0.55"/>

  <!-- Cabecera: dos filetes de distinto peso -->
  <line x1="72" y1="40" x2="1128" y2="40" stroke="#141210" stroke-width="3"/>
  <text x="72" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#141210" letter-spacing="7">EL PERFIL</text>
  <text x="1128" y="68" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8a8172" letter-spacing="3">VOL. 01 · MMXXVI · ROSARIO</text>
  <line x1="72" y1="84" x2="1128" y2="84" stroke="#141210" stroke-width="0.8"/>

  <!-- Titular -->
  <text x="72" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#141210" letter-spacing="-1.5">Emanuel Bertorello</text>
  <text x="72" y="198" font-family="Georgia, serif" font-style="italic" font-size="19" fill="#4a443a">desarrollador full stack · español nativo · inglés avanzado</text>

  <line x1="72" y1="224" x2="1128" y2="224" stroke="#141210" stroke-width="2"/>
</svg>
